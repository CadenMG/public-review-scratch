groups:
  - name: checkout
    rules:
      - alert: CheckoutErrorRateHigh
        expr: sum(rate(checkout_requests_total{code=~"5.."}[5m])) / sum(rate(checkout_requests_total[5m])) > 0.05
        for: 10m
        labels:
          severity: page
        annotations:
          summary: Checkout error rate is above 5%
